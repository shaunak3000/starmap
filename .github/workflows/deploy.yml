name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the newest one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The binary star tiers are generated, not committed, so CI rebuilds them.
      # The raw AT-HYG download is ~190 MB; caching it keeps repeat deploys to
      # about a minute and keeps the load off Codeberg. Keyed on sources.ts,
      # which holds the URLs and their expected byte sizes.
      - name: Cache raw catalogue downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: athyg-${{ hashFiles('scripts/sources.ts') }}

      - name: Fetch catalogue sources
        run: npm run data:fetch

      - name: Pack binary star tiers
        run: npm run data:build

      - name: Unit tests
        run: npm test

      - name: Build site
        run: npm run build
        env:
          BASE_PATH: /starmap/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
